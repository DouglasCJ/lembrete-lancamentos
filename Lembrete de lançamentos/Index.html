<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Head: meta e estilos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lembrete de Lançamento</title>

    <!-- Bibliotecas e estilos externos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="CSS/Styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark mb-4 shadow-sm">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center gap-3">
            <span class="navbar-brand fw-bold m-0"><i class="fas fa-rocket me-2"></i> Lembrete de Lançamento</span>
            <div class="text-white text-end px-2 py-1 rounded-3" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.08);">
                <small class="d-block opacity-75">Data de Hoje</small>
                <strong id="dataAtual">--/--/----</strong>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <div class="container-fluid px-4">
        <!-- Cards de resumo do total de lançamentos, pendentes e concluídos -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card card-resumo bg-primary shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="opacity-75 mb-1">Total de Lançamentos</h6>
                            <h2 id="countTotal" class="mb-0 fw-bold">0</h2>
                        </div>
                        <i class="fas fa-list-ul fa-2x opacity-25"></i>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card card-resumo bg-warning text-dark shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="opacity-75 mb-1">Aguardando (Pendentes)</h6>
                            <h2 id="countPendente" class="mb-0 fw-bold">0</h2>
                        </div>
                        <i class="fas fa-clock fa-2x opacity-25"></i>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card card-resumo bg-success shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="opacity-75 mb-1">Concluídos com Sucesso</h6>
                            <h2 id="countConcluido" class="mb-0 fw-bold">0</h2>
                        </div>
                        <i class="fas fa-check-double fa-2x opacity-25"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar e tabela -->
        <div class="row text-start">
            <div class="col-lg-3">
                <!-- Importação e sincronização dos dados -->
                <div class="card p-3 mb-4 shadow-sm">
                    <h6 class="fw-bold mb-3 text-primary"><i class="fas fa-file-excel me-2"></i>Nova Importação</h6>
                    <input type="file" id="inputExcel" class="form-control form-control-sm mb-3" accept=".xlsx, .xls">
                    <button class="btn btn-primary btn-sm w-100 fw-bold mb-2" onclick="processarExcel()">Visualizar e Adicionar</button>
                    <button id="btnRecarregarDados" class="btn btn-outline-secondary btn-sm w-100 fw-bold mb-2" onclick="recarregarDados()">
                        <i class="fas fa-rotate me-2"></i>Recarregar Dados
                    </button>
                    <button class="btn btn-success w-100 shadow fw-bold" id="btnSalvar" style="display:none;" onclick="enviarParaSupabase()">Sincronizar no Banco</button>
                </div>

                <!-- Filtros da interface por competência, responsável e status -->
                <div class="filter-section shadow-sm">
                    <div class="filter-title"><span>Filtros</span><span class="select-all-link" onclick="limparFiltros()">Limpar</span></div>
                    <label class="small fw-bold text-muted mb-1">Competência</label>
                    <select id="select-periodo" class="form-select form-select-sm mb-3" onchange="table.draw()"><option value="Todos">Todas</option></select>
                    <label class="small fw-bold text-muted mb-1">Responsável</label>
                    <select id="select-responsaveis" class="form-select form-select-sm mb-3" onchange="table.draw()"><option value="Todos">Todos</option></select>
                    <hr>
                    <label class="small fw-bold text-muted mb-2 d-block">Status na Tela</label>
                    <div class="btn-group w-100" role="group">
                        <input type="checkbox" class="btn-check filter-check" id="status-Pendente" value="Pendente" checked onchange="table.draw()">
                        <label class="btn btn-outline-warning btn-sm fw-bold" for="status-Pendente">Pendentes</label>
                        <input type="checkbox" class="btn-check filter-check" id="status-Concluido" value="Concluído" checked onchange="table.draw()">
                        <label class="btn btn-outline-success btn-sm fw-bold" for="status-Concluido">Concluídos</label>
                    </div>
                </div>

                <!-- Histórico de datas de corte e exportação por mês -->
                <div class="card p-3 mb-4 shadow-sm border-dark">
                    <h6 class="fw-bold mb-3 text-dark"><i class="fas fa-history-archive me-2"></i>Histórico Datas de Corte</h6>

                    <label class="small fw-bold text-muted mb-1">Selecionar mês do corte</label>
                    <div class="historico-date-wrap mb-3">
                        <input type="month" id="input-historico-data" class="form-control form-control-sm" aria-label="Selecionar o mês do corte para exportar o histórico">
                    </div>

                    <button class="btn btn-dark btn-sm w-100 fw-bold" onclick="exportarHistoricoCortes()">
                        <i class="fas fa-file-download me-2"></i>Exportar Datas de Corte
                    </button>
                </div>

                <!-- Exportação do relatório em Excel, com filtro por status -->
                <div class="card p-3 mb-4 shadow-sm border-success">
                    <h6 class="fw-bold mb-3 text-success"><i class="fas fa-file-export me-2"></i>Exportar Relatório</h6>
                    <select id="tipoExportacao" class="form-select form-select-sm mb-3">
                        <option value="Todos">Todos os registros</option>
                        <option value="Pendente">Apenas Pendentes</option>
                        <option value="Concluído">Apenas Concluídos</option>
                    </select>
                    <button class="btn btn-success btn-sm w-100 fw-bold" onclick="exportarParaExcel()">
                        <i class="fas fa-download me-2"></i>Baixar Excel
                    </button>
                </div>
            </div>

            <!-- Tabela e ações em massa -->
            <div class="col-lg-9">
                <div id="bulkActions" class="selected-actions bg-white p-3 rounded-3 shadow-sm border d-flex justify-content-between align-items-center">
                    <span><strong id="selectedCount">0</strong> itens selecionados</span>
                    <button class="btn btn-primary fw-bold" onclick="concluirSelecionados()">Concluir Selecionados</button>
                </div>
                <div class="card p-4 shadow-sm">
                    <div id="tabelaContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts externos e principais -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="JS/script.js"></script>

</body>
</html>
